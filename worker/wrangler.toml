# Notification service for the home-screen app (see worker/src/index.js).
# Deployed by .github/workflows/deploy-worker.yml, which also creates the KV
# namespace on first deploy and fills in its id below (the placeholder stays
# in the repo). Live at https://otwf-notify.otwf.workers.dev.
name = "otwf-notify"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

# Check the published live data for new alerts every 2 minutes.
[triggers]
crons = ["*/2 * * * *"]

[[kv_namespaces]]
binding = "SUBS"
id = "KV_NAMESPACE_ID"

# Live data published by the live update runs (see src/live.js).
[[durable_objects.bindings]]
name = "LIVE"
class_name = "LiveStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LiveStore"]
