name: Deploy notification service

# Deploys worker/ (the Cloudflare Worker behind the app's notifications).
# Uses the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets,
# plus LIVE_REFRESH_TOKEN (a fine-grained GitHub token for this repo with
# Actions: read and write) so pull-to-refresh can start a live update.
# CLOUDFLARE_API_TOKEN must be just the token (about 40 letters, digits, - and
# _), not Cloudflare's sample "curl ... Bearer ..." command.
on:
  push:
    branches:
      - main
    paths:
      - "worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "deploy-worker"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: worker
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      # Explains credential problems in the run's annotations (ids are shown
      # only as their first and last 4 characters).
      # Strip stray whitespace/newlines from the pasted secrets for later steps.
      - name: Tidy Cloudflare secrets
        run: |
          echo "::add-mask::$(printf %s "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          echo "CLOUDFLARE_API_TOKEN=$(printf %s "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$(printf %s "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')" >> "$GITHUB_ENV"
          node -e '
            const t = process.argv[1];
            console.error("::notice::Token secret shape: " + t.length + " characters; whitespace: " + /\s/.test(t) +
              "; contains quotes: " + /[\x22\x27]/.test(t) + "; contains \"Bearer\": " + /bearer/i.test(t) + "; contains \"curl\": " + /curl/i.test(t) +
              "; only letters/digits/_-: " + /^[A-Za-z0-9_-]+$/.test(t.trim()));
          ' "$CLOUDFLARE_API_TOKEN"
      - name: Check Cloudflare credentials
        run: |
          VERIFY=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify)
          ACCOUNTS=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts?per_page=50")
          ACCOUNT_VERIFY=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify")
          node -e '
            const t = process.argv[2], v = JSON.parse(process.argv[1]);
            console.error("::notice::Account-owned token check: " + (v.success ? v.result.status : JSON.stringify(v.errors)) +
              "; newer prefixed token format (cfxx_): " + /^cf[a-z]{2}_/.test(t));
          ' "$ACCOUNT_VERIFY" "$CLOUDFLARE_API_TOKEN"
          node -e '
            const [verify, accounts, configured] = process.argv.slice(1);
            const mask = s => s.length > 8 ? s.slice(0, 4) + "…" + s.slice(-4) : "(" + s.length + " chars)";
            const v = JSON.parse(verify), a = JSON.parse(accounts);
            const status = v.success ? v.result.status : "rejected " + JSON.stringify(v.errors);
            const ids = a.success ? a.result.map(x => mask(x.id)).join(", ") || "none" : "unavailable " + JSON.stringify(a.errors);
            const match = a.success && a.result.some(x => x.id === configured.trim());
            const note = `Token: ${status}. Accounts the token can see: ${ids}. Configured account id: ${mask(configured.trim())}${configured !== configured.trim() ? " (has extra spaces)" : ""}. Match: ${match}.`;
            console.error((match && v.success ? "::notice::" : "::error::") + note);
          ' "$VERIFY" "$ACCOUNTS" "$CLOUDFLARE_ACCOUNT_ID"
      # The KV namespace is created once, then found by name on later runs.
      # Uses Cloudflare's REST API directly (predictable JSON, errors shown).
      - name: Find or create the KV namespace
        run: |
          TITLE="otwf-notify-subs"
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::error::CLOUDFLARE_ACCOUNT_ID or CLOUDFLARE_API_TOKEN secret is missing or empty."; exit 1; fi
          LIST=$(curl -sS -H "$AUTH" "$API?per_page=100")
          ID=$(echo "$LIST" | node -e '
            let s = ""; process.stdin.on("data", d => s += d).on("end", () => {
              const body = JSON.parse(s);
              if (!body.success) { console.error("::error::Listing KV namespaces failed: " + JSON.stringify(body.errors)); process.exit(1); }
              const match = body.result.find(n => n.title === process.argv[1]);
              process.stdout.write(match ? match.id : "");
            });' "$TITLE")
          if [ -z "$ID" ]; then
            CREATED=$(curl -sS -X POST -H "$AUTH" -H "Content-Type: application/json" --data "{\"title\":\"$TITLE\"}" "$API")
            ID=$(echo "$CREATED" | node -e '
              let s = ""; process.stdin.on("data", d => s += d).on("end", () => {
                const body = JSON.parse(s);
                if (!body.success) { console.error("::error::Creating the KV namespace failed: " + JSON.stringify(body.errors)); process.exit(1); }
                process.stdout.write(body.result.id);
              });')
          fi
          sed -i "s/KV_NAMESPACE_ID/$ID/" wrangler.toml
          echo "Using KV namespace $ID"
      - name: Deploy
        run: npx --yes wrangler@4 deploy
      - name: Give the service its GitHub token
        env:
          LIVE_REFRESH_TOKEN: ${{ secrets.LIVE_REFRESH_TOKEN }}
        run: |
          if [ -z "$LIVE_REFRESH_TOKEN" ]; then
            echo "::warning::LIVE_REFRESH_TOKEN secret is not set, so pull-to-refresh can't start live updates."
            exit 0
          fi
          printf %s "$LIVE_REFRESH_TOKEN" | tr -d '[:space:]' | npx --yes wrangler@4 secret put GITHUB_TOKEN
      # The league survivor contest on Splash Sports: seeds the service's
      # session once (it renews and stores newer tokens itself afterwards).
      - name: Give the service its Splash session
        env:
          SPLASH_ACCESS_TOKEN: ${{ secrets.SPLASH_ACCESS_TOKEN }}
          SPLASH_REFRESH_TOKEN: ${{ secrets.SPLASH_REFRESH_TOKEN }}
        run: |
          if [ -z "$SPLASH_REFRESH_TOKEN" ]; then echo "::warning::SPLASH_REFRESH_TOKEN is not set; the survivor feed is off."; exit 0; fi
          printf %s "$SPLASH_ACCESS_TOKEN" | tr -d '[:space:]' | npx --yes wrangler@4 secret put SPLASH_ACCESS_TOKEN
          printf %s "$SPLASH_REFRESH_TOKEN" | tr -d '[:space:]' | npx --yes wrangler@4 secret put SPLASH_REFRESH_TOKEN
      # Shared with update-live.yml, which publishes the live data with it.
      - name: Give the service its live-publishing token
        env:
          LIVE_PUBLISH_TOKEN: ${{ secrets.LIVE_PUBLISH_TOKEN }}
        run: |
          if [ -z "$LIVE_PUBLISH_TOKEN" ]; then echo "::warning::LIVE_PUBLISH_TOKEN is not set; live runs keep deploying to GitHub Pages."; exit 0; fi
          printf %s "$LIVE_PUBLISH_TOKEN" | tr -d '[:space:]' | npx --yes wrangler@4 secret put LIVE_PUBLISH_TOKEN
      - name: Check the service responds
        run: |
          sleep 10
          curl -fsS https://otwf-notify.otwf.workers.dev/health
