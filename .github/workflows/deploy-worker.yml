name: Deploy notification service

# Deploys worker/ (the Cloudflare Worker behind the app's notifications).
# Uses the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets.
on:
  push:
    branches:
      - main
    paths:
      - "worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "deploy-worker"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: worker
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      # The KV namespace is created once, then found by name on later runs.
      # Uses Cloudflare's REST API directly (predictable JSON, errors shown).
      - name: Find or create the KV namespace
        run: |
          TITLE="otwf-notify-subs"
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          LIST=$(curl -sS -H "$AUTH" "$API?per_page=100")
          ID=$(echo "$LIST" | node -e '
            let s = ""; process.stdin.on("data", d => s += d).on("end", () => {
              const body = JSON.parse(s);
              if (!body.success) { console.error("Listing KV namespaces failed:", JSON.stringify(body.errors)); process.exit(1); }
              const match = body.result.find(n => n.title === process.argv[1]);
              process.stdout.write(match ? match.id : "");
            });' "$TITLE")
          if [ -z "$ID" ]; then
            CREATED=$(curl -sS -X POST -H "$AUTH" -H "Content-Type: application/json" --data "{\"title\":\"$TITLE\"}" "$API")
            ID=$(echo "$CREATED" | node -e '
              let s = ""; process.stdin.on("data", d => s += d).on("end", () => {
                const body = JSON.parse(s);
                if (!body.success) { console.error("Creating the KV namespace failed:", JSON.stringify(body.errors)); process.exit(1); }
                process.stdout.write(body.result.id);
              });')
          fi
          sed -i "s/KV_NAMESPACE_ID/$ID/" wrangler.toml
          echo "Using KV namespace $ID"
      - name: Deploy
        run: npx --yes wrangler@4 deploy
      - name: Check the service responds
        run: |
          sleep 10
          curl -fsS https://otwf-notify.otwf.workers.dev/health
