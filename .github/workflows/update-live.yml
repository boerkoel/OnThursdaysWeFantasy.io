name: Update Live Data

# GitHub's cron is best-effort and often skips frequent schedules for hours,
# so each run schedules the next one itself: every ~2 minutes while an NFL
# game window is open, otherwise it sleeps until the next window opens (at
# most 5.5 hours per run). The cron below only restarts the chain if it breaks.
#
# Live data is built and deployed straight to GitHub Pages instead of being
# committed; restore-live-state.js reads the previous run's state back from
# the published site. The daily ESPN update commits a snapshot once a day.
on:
  workflow_dispatch:
    inputs:
      force_update:
        description: "Force a live-data refresh for testing"
        required: false
        default: false
        type: boolean
      delay_seconds:
        description: "Seconds to wait before checking (set by the previous run)"
        required: false
        default: "0"
        type: string
      chained:
        description: "Started by the previous live run"
        required: false
        default: false
        type: boolean
      capture_snapshot:
        description: "Save this run's League Wire inputs and output for scripts/test-wire.js"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "2/5 * * * *"

permissions:
  contents: read
  actions: write
  pages: write
  id-token: write

# Runs queue instead of cancelling each other, so a run is never cut off
# mid-deploy and only one chain survives. A manual run cancels a sleeping
# chained run and takes over the chain.
concurrency:
  group: "live-update"
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' && !inputs.chained }}

env:
  ESPN_SEASON: "2026"
  ESPN_LEAGUE_ID: "998599827"
  ESPN_S2: ${{ secrets.ESPN_S2 }}
  ESPN_SWID: ${{ secrets.ESPN_SWID }}

jobs:
  update-live:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait for scheduled start
        if: inputs.delay_seconds != '' && inputs.delay_seconds != '0'
        run: sleep "${{ inputs.delay_seconds }}"

      # The latest main, not the commit this run was queued at: a chained run
      # can sleep for hours, and building from its queued commit would
      # republish older code and content (e.g. undo new obituaries).
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Check NFL live window
        id: window
        run: node scripts/check-nfl-live-window.js

      - name: Decide whether to update
        id: gate
        run: echo "update=${{ steps.window.outputs.active == 'true' || inputs.force_update == true }}" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        if: steps.gate.outputs.update == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Restore live state from the published site
        if: steps.gate.outputs.update == 'true'
        run: node scripts/restore-live-state.js

      # Raw ESPN files aren't committed; fetch the small league files
      # (settings, teams, matchups) each run, which also picks up a new week.
      - name: Fetch league settings and matchups
        if: steps.gate.outputs.update == 'true'
        env:
          ESPN_CORE_ONLY: "true"
        run: node scripts/fetch-espn.js

      - name: Fetch live ESPN data
        if: steps.gate.outputs.update == 'true'
        run: node scripts/fetch-live.js

      - name: Preserve previous scoreboard for live story detection
        if: steps.gate.outputs.update == 'true'
        run: cp data/current/scoreboard.json /tmp/previous-scoreboard.json || true

      - name: Fetch FantasyPros play chances
        if: steps.gate.outputs.update == 'true'
        continue-on-error: true
        run: node scripts/fetch-play-chance.js

      - name: Update live scoreboard
        if: steps.gate.outputs.update == 'true'
        run: node scripts/update-live-scoreboard.js

      - name: Update playoff odds
        if: steps.gate.outputs.update == 'true'
        continue-on-error: true
        run: node scripts/season-odds.js

      # Public guillotine side league; never let it block the main update.
      - name: Update guillotine Death Watch
        if: steps.gate.outputs.update == 'true'
        continue-on-error: true
        run: node scripts/update-guillotine.js

      - name: Fetch fantasy-relevant live plays
        if: steps.gate.outputs.update == 'true'
        continue-on-error: true
        env:
          ESPN_INCLUDE_COMPLETED: ${{ inputs.force_update == true && 'true' || 'false' }}
        run: node scripts/fetch-live-plays.js

      # Recent drops and how those players are doing (MANAGER MISCUE story).
      - name: Fetch recent drops
        if: steps.gate.outputs.update == 'true'
        continue-on-error: true
        env:
          ESPN_SEASON: "2026"
          ESPN_LEAGUE_ID: "998599827"
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: node scripts/fetch-drops.js

      # Breaking NFL headlines about players (League Wire NEWS).
      - name: Fetch player news
        if: steps.gate.outputs.update == 'true'
        continue-on-error: true
        run: node scripts/fetch-news.js

      # Sleeper's trending adds; the players file comes from the daily update.
      - name: Fetch Sleeper trending
        if: steps.gate.outputs.update == 'true'
        continue-on-error: true
        env:
          SLEEPER_TRENDING_ONLY: "true"
        run: node scripts/fetch-sleeper.js

      # Story test snapshot (manual runs only): the League Wire's inputs, saved
      # just before it runs; its output is added right after.
      - name: Capture League Wire inputs
        if: steps.gate.outputs.update == 'true' && inputs.capture_snapshot == true
        run: |
          mkdir -p wire-snapshot
          cp data/current/*.json wire-snapshot/
          cp /tmp/previous-scoreboard.json wire-snapshot/previous-scoreboard.json || true
          echo "{\"capturedAt\": $(date +%s000)}" > wire-snapshot/capture.json

      - name: Update League Wire
        if: steps.gate.outputs.update == 'true'
        env:
          PREVIOUS_SCOREBOARD_PATH: /tmp/previous-scoreboard.json
        run: node scripts/league-wire.js

      - name: Save League Wire snapshot
        if: steps.gate.outputs.update == 'true' && inputs.capture_snapshot == true
        run: cp data/current/marquee.json wire-snapshot/expected-marquee.json
      - name: Upload League Wire snapshot
        if: steps.gate.outputs.update == 'true' && inputs.capture_snapshot == true
        uses: actions/upload-artifact@v4
        with:
          name: wire-snapshot-${{ github.run_id }}
          path: wire-snapshot/
          retention-days: 30

      # The app reads live data from the notification service, so most runs
      # stop here: no site build or Pages deploy (~45 s saved per update).
      - name: Publish live data to the notification service
        id: publish
        if: steps.gate.outputs.update == 'true'
        env:
          LIVE_PUBLISH_TOKEN: ${{ secrets.LIVE_PUBLISH_TOKEN }}
        run: node scripts/publish-live.js

      # GitHub Pages stays a fallback: redeploy it when publishing failed, or
      # when its copy is over 20 minutes old.
      - name: Decide whether to redeploy GitHub Pages
        id: pages
        if: steps.gate.outputs.update == 'true'
        env:
          PUBLISHED: ${{ steps.publish.outputs.published }}
        run: |
          node -e '
            const published = process.env.PUBLISHED === "true";
            fetch("https://boerkoel.github.io/OnThursdaysWeFantasy.io/data/current/live.json?ts=" + Date.now())
              .then(r => r.ok ? r.json() : null).catch(() => null)
              .then(live => {
                const age = (Date.now() - Date.parse(live?.scoreboard?.lastUpdated || 0)) / 60000;
                const deploy = !published || !(age < 20);
                console.log(`Pages copy is ${Math.round(age)} min old; ${deploy ? "redeploying" : "no deploy needed"}.`);
                require("fs").appendFileSync(process.env.GITHUB_OUTPUT, `deploy=${deploy}\n`);
              });
          '

      # One annotation per run with each live file's timestamp, so a stale
      # file (e.g. a continue-on-error step that failed) shows on the run page.
      - name: Report live data freshness
        if: steps.gate.outputs.update == 'true'
        run: |
          node -e '
            const fs = require("fs");
            const files = ["scoreboard", "guillotine", "marquee", "live-plays", "season-odds"];
            const now = Date.now();
            const parts = files.map(f => {
              try {
                const d = JSON.parse(fs.readFileSync(`data/current/${f}.json`, "utf8"));
                const t = Date.parse(d.lastUpdated || d.updatedAt || "");
                const age = Number.isFinite(t) ? Math.round((now - t) / 1000) + "s" : "no timestamp";
                return `${f} wk${d.week ?? "?"} ${age}`;
              } catch (e) { return `${f} unreadable`; }
            });
            const stale = parts.some(p => !/ \d+s$/.test(p) || Number(p.match(/(\d+)s$/)[1]) > 300);
            console.log(`::${stale ? "warning" : "notice"} title=Live data::${parts.join(" · ")}`);
          '

      - name: Install dependencies
        if: steps.gate.outputs.update == 'true' && steps.pages.outputs.deploy == 'true'
        run: npm ci

      - name: Build site
        if: steps.gate.outputs.update == 'true' && steps.pages.outputs.deploy == 'true'
        run: npm run build

      - name: Upload Pages artifact
        if: steps.gate.outputs.update == 'true' && steps.pages.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.gate.outputs.update == 'true' && steps.pages.outputs.deploy == 'true'
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

      # Runs even if an update step failed, so one bad ESPN response doesn't
      # stop the chain. Skipped when this run is cancelled by a newer one.
      - name: Schedule next live run
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          ACTIVE: ${{ steps.window.outputs.active }}
          NEXT_WINDOW_IN: ${{ steps.window.outputs.next_window_in }}
        run: |
          MAX_IDLE=19800  # 5.5 hours, inside the job timeout
          if [ "$ACTIVE" = "true" ]; then
            DELAY=15      # plus ~30 seconds of work (and a Pages deploy now and then) = ~45 second cadence
          elif [ -z "$ACTIVE" ]; then
            DELAY=300     # window check failed; try again soon
          elif [ -n "$NEXT_WINDOW_IN" ] && [ "$NEXT_WINDOW_IN" -lt "$MAX_IDLE" ]; then
            DELAY="$NEXT_WINDOW_IN"
          else
            DELAY="$MAX_IDLE"
          fi
          # GitHub's daily cron is best-effort too. Between games, start the
          # daily ESPN update if its data is over 20 hours old, so a new week
          # (and its matchups) is picked up before the next kickoff.
          if [ "$ACTIVE" = "false" ]; then
            AGE_HOURS=$(node -e 'const m=require("./data/current/metadata.json"); console.log(Math.floor((Date.now()-Date.parse(m.fetchedAt))/3600000))' 2>/dev/null || echo 999)
            if [ "$AGE_HOURS" -ge 20 ]; then
              echo "ESPN data is $AGE_HOURS hours old; starting the daily update."
              gh workflow run update-espn.yml --repo "$GITHUB_REPOSITORY" --ref main || true
            fi
          fi
          echo "Next live run starts in $DELAY seconds."
          for attempt in 1 2 3; do
            if gh workflow run update-live.yml --repo "$GITHUB_REPOSITORY" --ref main \
                -f delay_seconds="$DELAY" -f chained=true; then
              exit 0
            fi
            sleep 10
          done
          echo "Unable to schedule the next live run; the cron schedule will restart the chain."
          exit 1
