name: Update Live Data

on:
  workflow_dispatch:
  schedule:
    - cron: "*/2 * * * *"

permissions:
  contents: write

jobs:
  update-live:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Fetch live ESPN data
        env:
          ESPN_SEASON: "2026"
          ESPN_LEAGUE_ID: "998599827"
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: node scripts/fetch-live.js
      - name: Update live scoreboard
        run: node scripts/update-live-scoreboard.js
      - name: Commit live data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/current/mLiveScoring.json data/current/mBoxscore.json data/current/mScoreboard.json data/current/scoreboard.json
          git diff --cached --quiet || git commit -m "Update live fantasy scores"
          git push
