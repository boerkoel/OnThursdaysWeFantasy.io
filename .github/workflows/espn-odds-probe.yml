name: ESPN odds probe (one-time)

# Looks for ESPN's head-to-head win probabilities in the fantasy API. Prints
# only key names, never league data. Safe to delete once found.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Probe
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: node scripts/espn-odds-probe.js
