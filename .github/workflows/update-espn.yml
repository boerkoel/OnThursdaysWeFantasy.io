name: Update ESPN data

on:
  workflow_dispatch:
  schedule:
    - cron: "15 8 * * *"
    # Wednesday mornings again, after the weekly waiver run, for the League
    # Wire's waiver stories (ESPN's processing hour is approximate, so twice).
    - cron: "30 13 * * 3"
    - cron: "30 17 * * 3"

permissions:
  contents: write
  actions: write

jobs:
  update-espn:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Fetch ESPN data
        env:
          ESPN_SEASON: "2026"
          ESPN_LEAGUE_ID: "998599827"
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: node scripts/fetch-espn.js
      - name: Cache team logos
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: node scripts/cache-team-logos.js
      - name: Fetch current live scoring
        env:
          ESPN_SEASON: "2026"
          ESPN_LEAGUE_ID: "998599827"
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: node scripts/fetch-live.js
      - name: Restore live state from the published site
        run: node scripts/restore-live-state.js
      - name: Preserve previous scoreboard for live story detection
        run: cp data/current/scoreboard.json /tmp/previous-scoreboard.json || true
      - name: Update live scoreboard
        env:
          ESPN_SEASON: "2026"
          ESPN_LEAGUE_ID: "998599827"
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: node scripts/update-live-scoreboard.js
      - name: Update playoff odds
        continue-on-error: true
        run: node scripts/season-odds.js
      - name: Update guillotine Death Watch
        continue-on-error: true
        run: node scripts/update-guillotine.js
      # Needs the ANTHROPIC_API_KEY repository secret; skips cleanly without it.
      - name: Write obituaries for newly chopped teams
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/write-obituaries.js
      - name: Calculate league stats
        run: node scripts/calculate-stats.js
      # Recent drops and how those players are doing (MANAGER MISCUE story).
      - name: Fetch recent drops
        continue-on-error: true
        env:
          ESPN_SEASON: "2026"
          ESPN_LEAGUE_ID: "998599827"
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: node scripts/fetch-drops.js

      # Breaking NFL headlines about players (League Wire NEWS).
      - name: Fetch player news
        continue-on-error: true
        run: node scripts/fetch-news.js

      # After the stats, so the week-in-review stories read the new weekly recap.
      - name: Update League Wire
        env:
          PREVIOUS_SCOREBOARD_PATH: /tmp/previous-scoreboard.json
        run: node scripts/league-wire.js
      # Past seasons are saved once to data/history; the record book combines
      # them with this season's finished games.
      - name: Save past seasons
        continue-on-error: true
        env:
          ESPN_SEASON: "2026"
          ESPN_LEAGUE_ID: "998599827"
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: node scripts/fetch-history.js
      - name: Build record book
        continue-on-error: true
        run: node scripts/build-record-book.js
      # Deploy is started explicitly: pushes made with GITHUB_TOKEN don't
      # trigger workflows, and neither does finishing a run that was started
      # by the live workflow.
      - name: Commit updated data and deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/current data/history public/team-logos public/guillotine-logos
          git diff --cached --quiet || git commit -m "Update ESPN league data and stats"
          for attempt in 1 2 3; do
            git fetch origin main
            git pull --rebase --autostash -X theirs origin main
            if git push origin HEAD:main; then
              gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main
              exit 0
            fi
            sleep 3
          done
          echo "Unable to push after 3 attempts."
          exit 1
